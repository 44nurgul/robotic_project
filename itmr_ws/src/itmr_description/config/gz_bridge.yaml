# ros_gz_bridge yapilandirmasi: Gazebo <-> ROS 2 topic esleme tablosu.
# Yeni bir sensor eklerken buraya eklenecek

# Simulasyon saati (use_sim_time icin gerekli)
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# Hız komutu: ROS -> Gazebo (DiffDrive plugin'i dinler)
- ros_topic_name: /cmd_vel
  gz_topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

# Odometri: Gazebo -> ROS
- ros_topic_name: /odom
  gz_topic_name: /odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

# odom -> base_footprint donusumu: Gazebo -> ROS
- ros_topic_name: /tf
  gz_topic_name: /model/itmrbot/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
